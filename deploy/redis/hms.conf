# /etc/redis/hms.conf — included from /etc/redis/redis.conf by install.sh.
# Redis here is ONLY the Celery broker: local-only, persistent, never evicts.

# Listen on this machine only (the app, workers and Flower are all local).
bind 127.0.0.1 -::1
protected-mode yes
port 6379

# Let systemd supervise it (restart on crash, start on boot).
supervised systemd

# Persist queued tasks across a Redis restart / server reboot.
appendonly yes
appendfsync everysec

# A broker must never silently drop messages: refuse writes when full
# instead of evicting queued tasks.
maxmemory 512mb
maxmemory-policy noeviction

# Uncomment and put the same password in CELERY_BROKER_URL
# (redis://:PASSWORD@127.0.0.1:6379/0) for defence in depth.
# requirepass CHANGE_ME
